<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YL 账号中心</title>
<style>
  :root { --bg: #fff; --text: #000; --line: #111; --blue: #3582e7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; height: 100vh; display: flex; justify-content: center; align-items: center; }
  
  /* 外边框卡片 */
  .auth-card { background: var(--bg); border: 6px solid var(--line); border-radius: 8px; width: 100%; max-width: 360px; padding: 30px 24px; display: none; }
  .auth-card.active { display: block; }

  /* 头部 Logo */
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
  .header img { width: 48px; height: 48px; object-fit: cover; }
  .header h2 { font-size: 22px; font-weight: 700; color: #000; letter-spacing: 1px; }

  /* 表单元素 */
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #000; }
  .input-box { width: 100%; height: 44px; border: 4px solid var(--line); border-radius: 4px; padding: 0 12px; font-size: 16px; outline: none; background: transparent; font-weight: 500;}
  .input-box:focus { border-color: var(--blue); }

  /* 验证码行 */
  .code-row { display: flex; gap: 10px; align-items: stretch; }
  .code-row .input-box { flex: 1; }
  .btn-get-code { width: 90px; border: 4px solid var(--line); background: transparent; font-weight: 700; font-size: 14px; cursor: pointer; border-radius: 4px; color: #000;}
  .btn-get-code:active { background: #eee; }
  .btn-get-code:disabled { color: #888; border-color: #888; }

  /* 主按钮 */
  .btn-primary { width: 100%; height: 50px; background: var(--blue); border: none; border-radius: 4px; color: #000; font-size: 18px; font-weight: 700; margin-top: 10px; cursor: pointer; transition: 0.2s; }
  .btn-primary:active { opacity: 0.8; }

  /* 底部链接 */
  .footer-links { display: flex; justify-content: space-between; margin-top: 20px; font-size: 14px; font-weight: 700; }
  .footer-links a { color: var(--blue); text-decoration: none; cursor: pointer; }
</style>
</head>
<body>

  <!-- 1. 登录页 -->
  <div class="auth-card active" id="view-login">
    <div class="header">
      <img src="./acsslogo.png" alt="Logo">
      <h2>登录YL账号</h2>
    </div>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="login-email" class="input-box">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="login-pwd" class="input-box">
    </div>
    <button class="btn-primary" onclick="doLogin()">登录</button>
    <div class="footer-links">
      <a onclick="switchView('register')">注册账号</a>
      <a onclick="switchView('reset')">忘记密码</a>
    </div>
  </div>

  <!-- 2. 注册页 -->
  <div class="auth-card" id="view-register">
    <div class="header">
      <img src="./acsslogo.png" alt="Logo">
      <h2>注册YL账号</h2>
    </div>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="reg-email" class="input-box">
    </div>
    <div class="form-group">
      <label>验证码</label>
      <div class="code-row">
        <input type="text" id="reg-code" class="input-box">
        <button class="btn-get-code" id="btn-reg-code" onclick="sendCode('reg-email', 'btn-reg-code')">点击获取</button>
      </div>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="reg-pwd" class="input-box">
    </div>
    <button class="btn-primary" onclick="doRegister()">注册</button>
    <div class="footer-links">
      <a onclick="switchView('login')">返回登录</a>
    </div>
  </div>

  <!-- 3. 密码重置页 -->
  <div class="auth-card" id="view-reset">
    <div class="header">
      <img src="./acsslogo.png" alt="Logo">
      <h2>密码重置</h2>
    </div>
    <div class="form-group">
      <label>邮箱</label>
      <input type="email" id="reset-email" class="input-box">
    </div>
    <div class="form-group">
      <label>验证码</label>
      <div class="code-row">
        <input type="text" id="reset-code" class="input-box">
        <button class="btn-get-code" id="btn-reset-code" onclick="sendCode('reset-email', 'btn-reset-code')">点击获取</button>
      </div>
    </div>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="reset-pwd" class="input-box">
    </div>
    <button class="btn-primary" onclick="doReset()">点击重置</button>
    <div class="footer-links">
      <a onclick="switchView('login')">返回登录</a>
    </div>
  </div>

<script>
  // 👇 把这里换成你刚才部署的后端 API 地址（注意是 api.acss 开头）
  const API_BASE = "https://api.acss.ylai.website";

  // 获取 URL 上的 returnUrl（比如从 BBS 跳过来会带）
  const urlParams = new URLSearchParams(window.location.search);
  const returnUrl = urlParams.get('returnUrl') || "";

  function switchView(viewName) {
    document.querySelectorAll('.auth-card').forEach(el => el.classList.remove('active'));
    document.getElementById(`view-${viewName}`).classList.add('active');
  }

  // 发送验证码并倒计时 50 秒
  async function sendCode(inputId, btnId) {
    const email = document.getElementById(inputId).value.trim();
    if (!email) return alert("请先输入邮箱");
    const btn = document.getElementById(btnId);
    
    btn.disabled = true;
    btn.innerText = "发送中...";

    try {
      const res = await fetch(`${API_BASE}/api/send-code`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      });
      
      if (res.ok) {
        let countdown = 50;
        btn.innerText = `${countdown}s`;
        const timer = setInterval(() => {
          countdown--;
          if (countdown <= 0) {
            clearInterval(timer);
            btn.disabled = false;
            btn.innerText = "点击获取";
          } else {
            btn.innerText = `${countdown}s`;
          }
        }, 1000);
      } else {
        alert("发送失败：" + await res.text());
        btn.disabled = false; btn.innerText = "点击获取";
      }
    } catch (e) {
      alert("网络错误"); btn.disabled = false; btn.innerText = "点击获取";
    }
  }

  // 执行登录
  async function doLogin() {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-pwd").value;
    if (!email || !password) return alert("请填写邮箱和密码");

    try {
      const res = await fetch(`${API_BASE}/api/login`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      
      if (res.ok) {
        // 登录成功，判断是否有要跳回的网站
        if (returnUrl) {
          // 把 token 和 email 拼在网址后跳回去
          window.location.href = `${returnUrl}${returnUrl.includes('?') ? '&' : '?'}token=${data.token}&username=${data.email}`;
        } else {
          alert("登录成功！但没有指定要返回的网站。");
        }
      } else {
        alert(data.error || "登录失败");
      }
    } catch (e) { alert("网络错误"); }
  }

  // 执行注册
  async function doRegister() {
    const email = document.getElementById("reg-email").value.trim();
    const code = document.getElementById("reg-code").value.trim();
    const password = document.getElementById("reg-pwd").value;
    if (!email || !code || !password) return alert("请填全信息");

    try {
      const res = await fetch(`${API_BASE}/api/register`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, code, password })
      });
      if (res.ok) {
        alert("注册成功，请登录！");
        switchView("login");
      } else { alert(await res.text()); }
    } catch (e) { alert("网络错误"); }
  }

  // 执行重置
  async function doReset() {
    const email = document.getElementById("reset-email").value.trim();
    const code = document.getElementById("reset-code").value.trim();
    const newPassword = document.getElementById("reset-pwd").value;
    if (!email || !code || !newPassword) return alert("请填全信息");

    try {
      const res = await fetch(`${API_BASE}/api/reset-password`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, code, newPassword })
      });
      if (res.ok) {
        alert("密码重置成功，请重新登录！");
        switchView("login");
      } else { alert(await res.text()); }
    } catch (e) { alert("网络错误"); }
  }
</script>
</body>
</html>
